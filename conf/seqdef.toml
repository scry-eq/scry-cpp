# scryd preferences — DEFAULTS.
#
# Generated from seqdef.xml by tools/prefs_xml_to_toml.py. Edit this file
# only if you are maintaining site-wide defaults; per-user settings belong
# in the user preferences file, which the daemon writes itself.

[Network]
# your network device
Device = "eth0"
# IP of EQ Client, 127.0.0.0 is a wild card used to tell showeq to automatically grab the next eq session it finds
IP = "127.0.0.0"
# MAC Address
MAC = ""
# Put network in realtime thread
RealTimeThread = false
# Don't use promiscous mode
NoPromiscuous = true
# Give up waiting for seq arq after cache fills to this size.  Don't set this too low, otherwise showeq will artificially skip packets, minimum is 32, modem users may want to set 512, dsl and cable users may choose 256 or less
ArqSeqGiveUp = 512
# enable/disable session tracking
SessionTracking = true
# Name of the file containing data about world opcodes
WorldOPCodes = "worldopcodes.xml"
# Name of the file containing data about zone opcodes
ZoneOPCodes = "zoneopcodes.xml"

[Defaults]
# Attempt to autodect level/race/class
AutoDetectCharSettings = true
# Default level of your character
DefaultLevel = 1
# Default race of your character = 1 HUM, 2 BAR, 3 ERU, 4 WLF, 5 HIE, 6 DELF, 7 HEF, 8 DWF, 9 TRL, 10 OGR, 11 HAF, 12 GNO, 128 IKS
DefaultRace = 1
# Default class for your character = 1 WAR, 2 CLE, 3 PAL, 4 RNG, 5 SHD, 6 DRU, 7 MNK, 8 BRD, 9 ROG, 10 SHM, 11 NEC, 12 WIZ, 13 MAG, 14 ENC
DefaultClass = 1
# Default deity of your character = 140 Agn, 201 Bert, 202 Brell, 303 Cazic, 204 Erol, 205 Bristle, 206 Inny, 207 Karana, 208 Mith, 209 Prex, 210 Quell, 211 Rallows, 213 Solusek, 214 Tribunal, 215 Tun, 216 Rodcet, 216 Veeshan
DefaultDeity = 140
# Default name for your character
DefaultName = "You"
# Default last name of your character
DefaultLastName = ""

[Misc]
# Create Unknown Spawns for those spawns with incomplete information
CreateUnknownSpawns = true
# Enable / disable spell casting messages
ShowSpellMessages = true
# enable logging of spawns
LogSpawns = false
# enable logging of items
LogItems = false
# enable the recording of spawn walk paths
WalkPathRecording = false
# number of spawn walk points to save per spawn
WalkPathLength = 25

[VPacket]
# filename to play/record packets from/to
Filename = ""
# set to true to record packets from session to Filename
Record = false
# set to true to playback packets from session in Filename
Playback = false
# Rate to playback; 0 = fast as possible, 1=1x, 2=2x, etc.
PlaybackRate = false
# Flush recorded packets to disk after each packet (useful for diagnosing crash problems)
FlushPackets = true
# ignore timestamps (compress time) for pckts over 1 sec
CompressTime = 0

