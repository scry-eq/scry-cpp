# Enable Race PVP display
RacePvP = false
# Gives you info about the spawn your mouse is over
ShowTooltips = true
# Display grid lines
ShowGridLines = true
# Display grid ticks
ShowGridTicks = true
# Display background image
ShowBackgroundImage = true
# Display debug info
ShowDebugInfo = false
# Display player
